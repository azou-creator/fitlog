name: fitlog
description: "训练日志 —— 个人健身 / 跑步训练日记（本地数据，无网络依赖）。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理 / 路由
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # 本地数据库
  drift: ^2.35.1
  path_provider: ^2.1.5

  # 图表 / 轻量配置
  fl_chart: ^0.69.2
  shared_preferences: ^2.3.4

  # 日期格式化（配合 flutter_localizations）
  intl: ^0.20.0
  share_plus: ^13.3.0
  file_picker: ^13.1.0
  image_picker: ^1.2.3
  uuid: ^4.6.0
  archive: ^4.3.0
  image: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Drift 代码生成
  drift_dev: ^2.35.1
  build_runner: ^2.4.15
  sqlite3: ^3.4.0

flutter:
  uses-material-design: true
